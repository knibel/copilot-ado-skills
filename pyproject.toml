[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-ado-skills"
version = "0.1.0"
description = "GitHub Copilot MCP skill for Azure DevOps git repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "azure-devops>=7.1.0b3",
    "azure-identity>=1.16.0",
    "gitpython>=3.1.40",
    "msrest>=0.7.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
copilot-ado-skills = "ado_git_skill.server:main"
copilot-ado-skills-invoke = "ado_git_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ado_git_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
